name: breezetravel-multi-local

x-backend: &backend
  image: ${BACKEND_IMAGE:-breezetravel-backend-local:python3.11}
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      PYTHON_BASE_IMAGE: python:3.11.11-slim-bookworm
  environment: &backend-env
    RUNTIME_PROFILE: test
    DEMO_MODE: "true"
    AMAP_MOCK: "true"
    FT_ROUTER_ENABLED: "false"
    RERANKER_ENABLED: "false"
    AUTO_MIGRATE: "false"
    REQUIRE_SCHEMA_CHECK: "true"
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/travel_agent
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET_KEY: local-multi-instance-only
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - ./backend:/app

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg16}
    environment:
      POSTGRES_DB: travel_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - multi-pg-data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/000_init.sql:ro

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:16379:6379"

  migrate:
    image: ${BACKEND_IMAGE:-breezetravel-backend-local:python3.11}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.11.11-slim-bookworm
    environment:
      <<: *backend-env
      REQUIRE_SCHEMA_CHECK: "false"
    command: python -m scripts.migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./backend:/app

  backend-a:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-a
    ports:
      - "127.0.0.1:18001:8000"

  backend-b:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-b
    ports:
      - "127.0.0.1:18002:8000"

  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27.4-alpine}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./multi-instance.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-a
      - backend-b

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend-a
      - backend-b

  y-websocket:
    build:
      context: ./y-websocket
    environment:
      HOST: 0.0.0.0
      PORT: 1234
      JWT_SECRET_KEY: local-multi-instance-only
      YPERSISTENCE: /data
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - multi-yjs-data:/data

volumes:
  multi-pg-data:
  multi-yjs-data:
