services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg16}
    environment:
      POSTGRES_DB: travel_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  y-websocket:
    build:
      context: ./y-websocket
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      - HOST=0.0.0.0
      - PORT=1234
      - YPERSISTENCE=/data
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - YJS_MAX_PAYLOAD_BYTES=${YJS_MAX_PAYLOAD_BYTES:-262144}
      - YJS_MAX_CONNECTIONS_PER_IP=${YJS_MAX_CONNECTIONS_PER_IP:-20}
      - YJS_E2E_CLEANUP_SECRET=${E2E_CLEANUP_SECRET:-}
      - YJS_RESTART_GATE_MODE=${E2E_RESTART_GATE_MODE:-false}
    volumes:
      - yjs-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${BACKEND_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ${BREEZETRAVEL_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379
      # Explicitly isolate Docker's deterministic entity fixtures from
      # ``local_real`` and public runs.  This makes the text-import E2E
      # executable without consuming a Provider quota or implying live POIs.
      RUNTIME_PROFILE: local_fixture
      DEMO_MODE: "false"
      # Local E2E uses fixtures. Live-provider validation is a separate,
      # explicit gate and must not be triggered by ordinary smoke tests.
      AMAP_MOCK: "true"
      # The container workdir is /app (the backend source root), whereas the
      # repository-level .env uses backend/models/... for host execution.
      FT_ROUTER_MODEL_PATH: models/router_lora
      # This CPU image intentionally does not bundle PyTorch/model weights.
      # Enable the FT route only in a GPU deployment image that includes them.
      FT_ROUTER_ENABLED: "false"
      AUTO_MIGRATE: "false"
      REQUIRE_SCHEMA_CHECK: "true"
      # Loopback-only Docker development: provides the existing test-account
      # endpoint for controlled E2E without sending SMS or using real users.
      DEV_LOGIN_BYPASS: "true"
      E2E_CLEANUP_SECRET: ${E2E_CLEANUP_SECRET:-}
      E2E_RESTART_GATE_MODE: ${E2E_RESTART_GATE_MODE:-false}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  trip-understanding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${BACKEND_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
    env_file:
      - ${BREEZETRAVEL_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379
      RUNTIME_PROFILE: local_fixture
      AMAP_MOCK: "true"
      AUTO_MIGRATE: "false"
      REQUIRE_SCHEMA_CHECK: "true"
    volumes:
      - ./backend:/app
    command: python -m app.trip_understanding.worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${BACKEND_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
    env_file:
      - ${BREEZETRAVEL_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/travel_agent
    volumes:
      - ./backend:/app
    command: python -m scripts.migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${BACKEND_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ${BREEZETRAVEL_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379
      AMAP_MOCK: "true"      # MCP Server 默认使用 Mock，保护配额
    volumes:
      - ./backend:/app
    command: python -m app.mcp_server 8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser requests stay same-origin and are proxied by Next to the
        # backend service. This avoids baking a stale host/LAN address into a
        # local Docker build.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_Y_WEBSOCKET_URL: ws://localhost:1234
        NEXT_PUBLIC_AMAP_JS_KEY: ${NEXT_PUBLIC_AMAP_JS_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
        BACKEND_INTERNAL_URL: http://backend:8000
        # Exposes only the local backend's DEV_LOGIN_BYPASS test account.
        NEXT_PUBLIC_SHOW_TEST_LOGIN: "true"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  pg-data:
  yjs-data:
