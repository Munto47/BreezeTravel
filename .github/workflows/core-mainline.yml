  g04_browser_e2e:
    name: g04_browser_e2e
    needs: core-mainline-preflight
    if: ${{ needs.core-mainline-preflight.outputs.sequence == '4' && needs.core-mainline-preflight.outputs.work_kind != 'GOAL_TRANSITION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/travel_agent
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      RUNTIME_PROFILE: local_fixture
      TRIP_UNDERSTANDING_PROVIDER_MODE: fixture
      SCREENSHOT_OCR_MODE: fixture
      G04_EVIDENCE_LEVEL: AUTOMATED_FIXTURE_CI
      AMAP_MOCK: "true"
      DEV_LOGIN_BYPASS: "true"
      JWT_SECRET_KEY: core-mainline-local-only-secret-2026
      TRIP_UNDERSTANDING_SOURCE_ENCRYPTION_KEY: core-mainline-source-key-2026
      RUN_SERVICE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Create browser database and migrate
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          from pathlib import Path
          async def main():
              connection = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/postgres")
              try:
                  exists = await connection.fetchval("SELECT 1 FROM pg_database WHERE datname='travel_agent'")
                  if not exists:
                      await connection.execute("CREATE DATABASE travel_agent")
              finally:
                  await connection.close()
              bootstrap = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/travel_agent")
              try:
                  await bootstrap.execute(Path("app/db/init.sql").read_text(encoding="utf-8"))
              finally:
                  await bootstrap.close()
          asyncio.run(main())
          PY
          python -m scripts.migrate
      - name: Start fixture services
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8999 > /tmp/g04-backend.log 2>&1 &
          nohup python -m app.trip_understanding.worker > /tmp/g04-understanding-worker.log 2>&1 &
          nohup python -m app.trip_understanding.map_worker > /tmp/g04-map-worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8999/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/g04-backend.log
          exit 1
      - name: Verify screenshot browser journey with fixture OCR
        working-directory: frontend
        run: npm run test:e2e:screenshot
      - name: Show G04 service logs on failure
        if: failure()
        shell: bash
        run: |
          for log in /tmp/g04-*.log; do
            if test -f "$log"; then echo "=== $log ==="; tail -n 200 "$log"; fi
          done

  core-mainline:
    name: core-mainline
    if: ${{ always() }}
    needs:
      - core-mainline-preflight
      - g04_screenshot_targeted
      - g04_postgresql
      - g04_historical_backend
      - g04_browser_e2e
      - g05_knowledge_targeted
      - g05_postgresql
      - g05_browser_e2e
      - g06_memory_share_targeted
      - g06_postgresql
      - g06_browser_e2e
      - frontend_build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREFLIGHT_RESULT: ${{ needs.core-mainline-preflight.result }}
      GOAL_SEQUENCE: ${{ needs.core-mainline-preflight.outputs.sequence }}
      WORK_KIND: ${{ needs.core-mainline-preflight.outputs.work_kind }}
      G04_SCREENSHOT_TARGETED_RESULT: ${{ needs.g04_screenshot_targeted.result }}
      G04_POSTGRESQL_RESULT: ${{ needs.g04_postgresql.result }}
      G04_HISTORICAL_BACKEND_RESULT: ${{ needs.g04_historical_backend.result }}
      G04_BROWSER_E2E_RESULT: ${{ needs.g04_browser_e2e.result }}
      G05_KNOWLEDGE_TARGETED_RESULT: ${{ needs.g05_knowledge_targeted.result }}
      G05_POSTGRESQL_RESULT: ${{ needs.g05_postgresql.result }}
      G05_BROWSER_E2E_RESULT: ${{ needs.g05_browser_e2e.result }}
      G06_MEMORY_SHARE_TARGETED_RESULT: ${{ needs.g06_memory_share_targeted.result }}
      G06_POSTGRESQL_RESULT: ${{ needs.g06_postgresql.result }}
      G06_BROWSER_E2E_RESULT: ${{ needs.g06_browser_e2e.result }}
      FRONTEND_BUILD_RESULT: ${{ needs.frontend_build.result }}
    steps:
      - name: Enforce required product-mainline results
        shell: bash
        run: |
          if [ "$PREFLIGHT_RESULT" != "success" ]; then
            echo "core-mainline preflight did not succeed: $PREFLIGHT_RESULT"
            exit 1
          fi

          if [ "$GOAL_SEQUENCE" = "4" ] && [ "$WORK_KIND" != "GOAL_TRANSITION" ]; then
            expected_g04_result="success"
          else
            expected_g04_result="skipped"
          fi

          for result_name in \
            G04_SCREENSHOT_TARGETED_RESULT \
            G04_POSTGRESQL_RESULT \
            G04_HISTORICAL_BACKEND_RESULT \
            G04_BROWSER_E2E_RESULT
          do
            actual_result="${!result_name}"
            if [ "$actual_result" != "$expected_g04_result" ]; then
              echo "$result_name must be $expected_g04_result, got $actual_result"
              exit 1
            fi
          done

          if [ "$GOAL_SEQUENCE" = "5" ] && [ "$WORK_KIND" != "GOAL_TRANSITION" ]; then
            expected_g05_result="success"
          else
            expected_g05_result="skipped"
          fi

          for result_name in \
            G05_KNOWLEDGE_TARGETED_RESULT \
            G05_POSTGRESQL_RESULT \
            G05_BROWSER_E2E_RESULT
          do
            actual_result="${!result_name}"
            if [ "$actual_result" != "$expected_g05_result" ]; then
              echo "$result_name must be $expected_g05_result, got $actual_result"
              exit 1
            fi
          done

          if [ "$GOAL_SEQUENCE" = "6" ] && [ "$WORK_KIND" != "GOAL_TRANSITION" ]; then
            expected_g06_result="success"
          else
            expected_g06_result="skipped"
          fi

          for result_name in \
            G06_MEMORY_SHARE_TARGETED_RESULT \
            G06_POSTGRESQL_RESULT \
            G06_BROWSER_E2E_RESULT
          do
            actual_result="${!result_name}"
            if [ "$actual_result" != "$expected_g06_result" ]; then
              echo "$result_name must be $expected_g06_result, got $actual_result"
              exit 1
            fi
          done

          if { [ "$GOAL_SEQUENCE" = "4" ] || [ "$GOAL_SEQUENCE" = "5" ] || [ "$GOAL_SEQUENCE" = "6" ]; } && [ "$WORK_KIND" != "GOAL_TRANSITION" ]; then
            expected_frontend_result="success"
          else
            expected_frontend_result="skipped"
          fi
          if [ "$FRONTEND_BUILD_RESULT" != "$expected_frontend_result" ]; then
            echo "FRONTEND_BUILD_RESULT must be $expected_frontend_result, got $FRONTEND_BUILD_RESULT"
            exit 1
          fi
