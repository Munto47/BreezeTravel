name: Product checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RUNTIME_PROFILE: test
  TRIP_UNDERSTANDING_PROVIDER_MODE: fixture
  AMAP_MOCK: "true"
  DEMO_MODE: "true"
  REQUIRE_SCHEMA_CHECK: "false"
  FT_ROUTER_ENABLED: "false"
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""
  QWEN_API_KEY: ""
  AMAP_API_KEY: ""
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check current product direction
        working-directory: backend
        run: python -m scripts.validate_core_mainline
      - name: Repository diff hygiene
        run: git diff --check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check changed validation entrypoints
        working-directory: backend
        run: >-
          python -m ruff check
          governance/experience_delivery.py
          scripts/validate_core_mainline.py
          scripts/validate_work_packages.py
          tests/test_experience_delivery_contract.py
      - name: Verify API, places, privacy, edits and map behavior
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_experience_delivery_contract.py
          tests/test_trip_understanding_v3.py
          tests/test_trip_understanding_v3_api.py
          tests/test_trip_understanding_natural_routes.py
          tests/test_amap_trip_understanding.py
          tests/test_amap_route_trip_understanding.py
          tests/test_g03r_place_resolution.py
          tests/test_g02_map_stay.py
          tests/test_g03_top3_audit.py
          tests/test_g06_memory_share_targeted.py
          --junitxml=product-backend.xml
      - name: Preserve backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-backend-results
          path: backend/product-backend.xml
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      RUN_SERVICE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify durable state, concurrency, map edits and deletion
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_trip_understanding_v3_postgres.py
          tests/test_g01_map_positive_postgres.py
          tests/test_g02_map_stay_postgres.py
          tests/test_g03_top3_audit_postgres.py
          tests/test_g06_memory_share_postgres.py
          --junitxml=product-postgres.xml
      - name: Confirm database checks actually ran
        working-directory: backend
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse("product-postgres.xml").getroot()
          cases = root.findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("PostgreSQL checks must execute without skips")
          PY
      - name: Preserve PostgreSQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-postgres-results
          path: backend/product-postgres.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  core-mainline:
    name: core-mainline
    needs: [contract, backend, postgres, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all current code checks
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$FRONTEND_RESULT" = success
          echo "Contract, backend, PostgreSQL and frontend build passed." >> "$GITHUB_STEP_SUMMARY"
          echo "The 12-scenario browser suite, live providers and user experience are NOT_RUN in this stage-0 workflow." >> "$GITHUB_STEP_SUMMARY"
