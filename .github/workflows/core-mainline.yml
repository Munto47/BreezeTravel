name: Product mainline

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-mainline-preflight:
    name: core-mainline-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sequence: ${{ steps.goal.outputs.sequence }}
      work_kind: ${{ steps.goal.outputs.work_kind }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/travel_agent
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      RUNTIME_PROFILE: local_fixture
      TRIP_UNDERSTANDING_PROVIDER_MODE: fixture
      SCREENSHOT_OCR_MODE: fixture
      AMAP_MOCK: "true"
      DEV_LOGIN_BYPASS: "true"
      JWT_SECRET_KEY: core-mainline-local-only-secret-2026
      TRIP_UNDERSTANDING_SOURCE_ENCRYPTION_KEY: core-mainline-source-key-2026
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      QWEN_API_KEY: ""
      AMAP_API_KEY: ""
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      RUN_SERVICE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install targeted delivery dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium

      - name: Read active Goal
        id: goal
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from pathlib import Path

          registry = json.loads(Path("docs/governance/current_work_packages.json").read_text(encoding="utf-8"))
          sequence = registry["active_goal_sequence"]
          work_kind = registry["active_slice"]["work_kind"]
          base_ref = os.environ.get("BASE_SHA") or "origin/develop"
          result = subprocess.run(
              ["git", "show", f"{base_ref}:docs/governance/current_goal_binding.json"],
              check=False,
              capture_output=True,
              text=True,
              encoding="utf-8",
          )
          if result.returncode == 0:
              base_sequence = json.loads(result.stdout)["goal_sequence"]
              if sequence == base_sequence + 1:
                  work_kind = "GOAL_TRANSITION"
          print(f"sequence={sequence}")
          print(f"work_kind={work_kind}")
          PY

      - name: Enforce product-mainline scope
        working-directory: backend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          base_ref="${BASE_SHA:-origin/develop}"
          head_ref="${HEAD_SHA:-HEAD}"
          python -m scripts.validate_core_mainline --base-ref "$base_ref" --head-ref "$head_ref"

      - name: Check delivery governance code
        working-directory: backend
        run: >-
          python -m ruff check
          governance
          scripts/run_g04_paddle_gate.py
          scripts/run_g05_knowledge_gate.py
          scripts/validate_work_packages.py
          scripts/validate_core_mainline.py
          tests/test_product_delivery_governance.py
          tests/test_g04_governance_delivery.py
          tests/test_g05_governance_delivery.py
          tests/test_product_work_packages_v3.py
          tests/test_g01_delivery_samples.py

      - name: Verify delivery contracts
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_product_delivery_governance.py
          tests/test_governance_agent_gate_transition.py
          tests/test_product_work_packages_v3.py

      - name: Verify G01 fixed samples and v3 journey
        if: steps.goal.outputs.sequence == '1' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_g01_delivery_samples.py
          tests/test_trip_understanding_v3.py
          tests/test_trip_understanding_v3_api.py
          tests/test_amap_trip_understanding.py
          tests/test_amap_route_trip_understanding.py

      - name: Verify G02 product package
        if: steps.goal.outputs.sequence == '2' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: backend
        shell: bash
        run: python -m pytest -q tests/test_g02_*.py --ignore-glob='tests/test_g02_*_postgres.py'

      - name: Verify G03 product package
        if: steps.goal.outputs.sequence == '3' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: backend
        shell: bash
        run: python -m pytest -q tests/test_g03_*.py --ignore-glob='tests/test_g03_*_postgres.py'

      - name: Create browser database and migrate
        if: steps.goal.outputs.work_kind != 'GOAL_TRANSITION' && steps.goal.outputs.sequence != '4' && steps.goal.outputs.sequence != '5' && steps.goal.outputs.sequence != '6'
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          from pathlib import Path
          async def main():
              connection = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/postgres")
              try:
                  exists = await connection.fetchval("SELECT 1 FROM pg_database WHERE datname='travel_agent'")
                  if not exists:
                      await connection.execute("CREATE DATABASE travel_agent")
              finally:
                  await connection.close()
              bootstrap = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/travel_agent")
              try:
                  await bootstrap.execute(Path("app/db/init.sql").read_text(encoding="utf-8"))
              finally:
                  await bootstrap.close()
          asyncio.run(main())
          PY
          python -m scripts.migrate

      - name: Verify G01 PostgreSQL chain
        if: steps.goal.outputs.sequence == '1' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_trip_understanding_v3_postgres.py
          tests/test_g01_map_positive_postgres.py

      - name: Verify G02 PostgreSQL chain
        if: steps.goal.outputs.sequence == '2' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: backend
        shell: bash
        run: python -m pytest -q tests/test_g02_*_postgres.py

      - name: Verify G03 PostgreSQL chain
        if: steps.goal.outputs.sequence == '3' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: backend
        shell: bash
        run: python -m pytest -q tests/test_g03_*_postgres.py

      - name: Build frontend
        if: steps.goal.outputs.work_kind != 'GOAL_TRANSITION' && steps.goal.outputs.sequence != '4' && steps.goal.outputs.sequence != '5' && steps.goal.outputs.sequence != '6'
        working-directory: frontend
        run: npm run build

      - name: Start v3 backend and workers
        if: steps.goal.outputs.work_kind != 'GOAL_TRANSITION' && steps.goal.outputs.sequence != '4' && steps.goal.outputs.sequence != '5' && steps.goal.outputs.sequence != '6'
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8999 > /tmp/core-mainline-backend.log 2>&1 &
          nohup python -m app.trip_understanding.worker > /tmp/core-mainline-understanding-worker.log 2>&1 &
          nohup python -m app.trip_understanding.map_worker > /tmp/core-mainline-map-worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8999/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/core-mainline-backend.log
          exit 1

      - name: Verify G01 browser journey
        if: steps.goal.outputs.sequence == '1' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: frontend
        run: npx playwright test e2e/trip-understanding-v3.spec.js -c playwright.product-delivery.config.js

      - name: Verify G02 browser journey
        if: steps.goal.outputs.sequence == '2' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: frontend
        run: npx playwright test e2e/g02-product-delivery.spec.js -c playwright.product-delivery.config.js

      - name: Verify G03 browser journey
        if: steps.goal.outputs.sequence == '3' && steps.goal.outputs.work_kind != 'GOAL_TRANSITION'
        working-directory: frontend
        run: npx playwright test e2e/g03-product-delivery.spec.js -c playwright.product-delivery.config.js

      - name: Confirm current delivery result
        if: steps.goal.outputs.work_kind == 'GOAL_TRANSITION'
        working-directory: backend
        run: python -m scripts.validate_core_mainline --base-ref HEAD^ --require-delivery-pass

      - name: Show service logs on failure
        if: failure() && steps.goal.outputs.work_kind != 'GOAL_TRANSITION' && steps.goal.outputs.sequence != '4' && steps.goal.outputs.sequence != '5' && steps.goal.outputs.sequence != '6'
        shell: bash
        run: |
          for log in /tmp/core-mainline-*.log; do
            if test -f "$log"; then echo "=== $log ==="; tail -n 200 "$log"; fi
          done

      - name: Repository diff hygiene
        run: git diff --check

  g04_screenshot_targeted:
    name: g04_screenshot_targeted
    needs: core-mainline-preflight
    if: ${{ needs.core-mainline-preflight.outputs.sequence == '4' && needs.core-mainline-preflight.outputs.work_kind != 'GOAL_TRANSITION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_PROFILE: local_fixture
      TRIP_UNDERSTANDING_PROVIDER_MODE: fixture
      SCREENSHOT_OCR_MODE: fixture
      G04_EVIDENCE_LEVEL: AUTOMATED_FIXTURE_CI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Assert fixture evidence boundary
        shell: bash
        run: |
          test "$SCREENSHOT_OCR_MODE" = fixture
          test "$G04_EVIDENCE_LEVEL" = AUTOMATED_FIXTURE_CI
      - name: Verify screenshot fixture contract and compatibility
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_g04_formal_gate.py
          tests/test_g04_governance_delivery.py
          tests/test_g04_screenshot_batches_unit.py
          tests/test_g04_screenshot_ocr_unit.py
          tests/test_g04_screenshot_api.py
          tests/test_g04_screenshot_cleanup_lifecycle.py
          tests/test_g04_screenshot_pipeline.py
          tests/test_g04_private_data_maintenance.py
          tests/test_g04_public_privacy_boundaries.py
          tests/test_g04_schema_compatibility.py
          tests/test_trip_understanding_v3.py
          tests/test_trip_understanding_v3_api.py
          tests/test_screenshot_imports.py
          tests/test_screenshot_upload_batches.py

  g04_postgresql:
    name: g04_postgresql
    needs: core-mainline-preflight
    if: ${{ needs.core-mainline-preflight.outputs.sequence == '4' && needs.core-mainline-preflight.outputs.work_kind != 'GOAL_TRANSITION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/travel_agent
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      RUNTIME_PROFILE: local_fixture
      SCREENSHOT_OCR_MODE: fixture
      G04_EVIDENCE_LEVEL: AUTOMATED_FIXTURE_CI
      TRIP_UNDERSTANDING_SOURCE_ENCRYPTION_KEY: core-mainline-source-key-2026
      RUN_SERVICE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Create PostgreSQL database and migrate
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          from pathlib import Path
          async def main():
              connection = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/postgres")
              try:
                  exists = await connection.fetchval("SELECT 1 FROM pg_database WHERE datname='travel_agent'")
                  if not exists:
                      await connection.execute("CREATE DATABASE travel_agent")
              finally:
                  await connection.close()
              bootstrap = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/travel_agent")
              try:
                  await bootstrap.execute(Path("app/db/init.sql").read_text(encoding="utf-8"))
              finally:
                  await bootstrap.close()
          asyncio.run(main())
          PY
          python -m scripts.migrate
      - name: Verify G04 PostgreSQL lifecycle
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_g04_screenshot_postgres.py
          tests/test_trip_understanding_v3_postgres.py
          tests/test_screenshot_postgres_integration.py
      - name: Prepare POSIX backend regression compatibility
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          sudo install -m 0755 scripts/ci_posix_cmd_junction_shim.py /usr/local/bin/cmd
          python -m pip install pydantic==2.10.4
      - name: Verify backend service and non-P5 regression
        working-directory: backend
        env:
          P3_OCR_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python -m scripts.run_g04_non_p5_regression

  g04_historical_backend:
    name: g04_historical_backend
    needs: core-mainline-preflight
    if: ${{ needs.core-mainline-preflight.outputs.sequence == '4' && needs.core-mainline-preflight.outputs.work_kind != 'GOAL_TRANSITION' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      P3_OCR_FONT_PATH: 'C:\Windows\Fonts\msyh.ttc'
      P5_OCR_FONT_PATH: 'C:\Windows\Fonts\msyh.ttc'
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: backend/requirements-historical-p5-ci.txt
      - name: Install frozen historical P5 CI profile
        run: python -m pip install -r backend/requirements-historical-p5-ci.txt
      - name: Provision exact historical text layout ABI
        shell: pwsh
        run: |
          $condaRoot = $env:CONDA
          if ([string]::IsNullOrWhiteSpace($condaRoot)) {
            $condaRoot = 'C:\Miniconda'
          }
          $condaExe = Join-Path $condaRoot 'Scripts\conda.exe'
          if (-not (Test-Path -LiteralPath $condaExe -PathType Leaf)) {
            throw "GitHub Windows Miniconda is unavailable: $condaExe"
          }
          $nativePrefix = Join-Path $env:RUNNER_TEMP 'g04-p5-native'
          & $condaExe create --prefix $nativePrefix --yes --override-channels --channel defaults 'fribidi=1.0.10=h62dcd97_0'
          if ($LASTEXITCODE -ne 0) {
            throw "failed to provision frozen FriBidi runtime: exit $LASTEXITCODE"
          }
          $nativeBin = Join-Path $nativePrefix 'Library\bin'
          $fribidiPath = Join-Path $nativeBin 'fribidi-0.dll'
          $expectedFribidiHash = '463c7479d434a8681a9dbde16d0675e28d09d38fa43e3e18d826e345584ba18d'
          if (-not (Test-Path -LiteralPath $fribidiPath -PathType Leaf)) {
            throw "frozen FriBidi runtime is unavailable: $fribidiPath"
          }
          $actualFribidiHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $fribidiPath).Hash.ToLowerInvariant()
          if ($actualFribidiHash -ne $expectedFribidiHash) {
            throw "frozen FriBidi hash mismatch: expected $expectedFribidiHash, got $actualFribidiHash"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nativeBin -Encoding utf8
      - name: Verify exact historical font and P5 regression
        working-directory: backend
        shell: pwsh
        run: |
          $expectedFontHash = 'd79c55e68b1131eea0cc1c47be4f572d964f28c682e143db2ad09c1e4cb07a3f'
          if (-not (Test-Path -LiteralPath $env:P5_OCR_FONT_PATH -PathType Leaf)) {
            throw "frozen P5 font is unavailable: $env:P5_OCR_FONT_PATH"
          }
          $actualFontHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:P5_OCR_FONT_PATH).Hash.ToLowerInvariant()
          if ($actualFontHash -ne $expectedFontHash) {
            throw "frozen P5 font hash mismatch: expected $expectedFontHash, got $actualFontHash"
          }
          @'
          import json
          import platform
          import sys
          from pathlib import Path

          import PIL
          from PIL import ImageFont, features

          from evals.trip_check_v1.p5.evidence_materialization_v3 import _render_contract_v3

          rows = Path("evals/trip_check_v1/p5/materializations_nonblind_v3.jsonl")
          case = next(
              json.loads(line)
              for line in rows.read_text(encoding="utf-8").splitlines()
              if json.loads(line).get("case_id") == "p5.dev.bj.002"
          )
          product_input = case["source_payload"]["product_input"]
          actual = _render_contract_v3(
              product_input["source_text"],
              json.dumps(product_input["render_spec"], ensure_ascii=False, sort_keys=True),
          )
          expected = (
              case["render_receipt"]["image_sha256"],
              case["render_receipt"]["byte_size"],
          )
          diagnostic = {
              "python": sys.version,
              "platform": platform.platform(),
              "pillow": PIL.__version__,
              "freetype": features.version("freetype2"),
              "raqm": features.version_feature("raqm"),
              "fribidi": features.version_feature("fribidi"),
              "harfbuzz": features.version_feature("harfbuzz"),
              "layout_engine": int(
                  ImageFont.truetype(str(Path("C:/Windows/Fonts/msyh.ttc")), 34).layout_engine
              ),
              "expected": expected,
              "actual": actual[:2],
          }
          print("P5_RENDERER_ABI " + json.dumps(diagnostic, ensure_ascii=False, sort_keys=True))
          expected_abi = {
              "pillow": "12.2.0",
              "freetype": "2.14.3",
              "raqm": "0.10.3",
              "fribidi": "1.0.10",
              "harfbuzz": "13.2.1",
              "layout_engine": 1,
          }
          if actual[:2] != expected or any(
              diagnostic[key] != value for key, value in expected_abi.items()
          ):
              raise SystemExit("frozen P5 renderer ABI mismatch")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "frozen P5 renderer ABI preflight failed: exit $LASTEXITCODE"
          }
          $testFiles = @(
            Get-ChildItem -LiteralPath tests -Filter 'test_trip_check_p5*.py' |
              Sort-Object -Property Name |
              ForEach-Object { $_.FullName }
          )
          if ($testFiles.Count -eq 0) {
            throw 'historical P5 regression partition is empty'
          }
          python -m pytest -q @testFiles

