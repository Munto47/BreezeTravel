name: Product checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RUNTIME_PROFILE: test
  TRIP_UNDERSTANDING_PROVIDER_MODE: fixture
  AMAP_MOCK: "true"
  DEMO_MODE: "true"
  REQUIRE_SCHEMA_CHECK: "false"
  FT_ROUTER_ENABLED: "false"
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""
  QWEN_API_KEY: ""
  AMAP_API_KEY: ""
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check current product direction
        working-directory: backend
        run: python -m scripts.validate_core_mainline
      - name: Repository diff hygiene
        run: git diff --check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check changed validation entrypoints
        working-directory: backend
        run: >-
          python -m ruff check
          governance/experience_delivery.py
          scripts/validate_core_mainline.py
          scripts/validate_work_packages.py
          tests/test_experience_delivery_contract.py
      - name: Verify API, places, privacy, edits and map behavior
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_experience_delivery_contract.py
          tests/test_trip_understanding_v3.py
          tests/test_trip_understanding_v3_api.py
          tests/test_experience_inference.py
          tests/test_experience_runtime.py
          tests/test_experience_twelve_tasks.py
          tests/test_experience_timing_candidates.py
          tests/test_amap_trip_understanding.py
          tests/test_amap_route_trip_understanding.py
          tests/test_g03r_place_resolution.py
          tests/test_g02_map_stay.py
          tests/test_g03_top3_audit.py
          tests/test_g06_memory_share_targeted.py
          --junitxml=product-backend.xml
      - name: Preserve backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-backend-results
          path: backend/product-backend.xml
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      RUN_SERVICE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify durable state, concurrency, map edits and deletion
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_trip_understanding_v3_postgres.py
          tests/test_g01_map_positive_postgres.py
          tests/test_g02_map_stay_postgres.py
          tests/test_g03_top3_audit_postgres.py
          tests/test_g06_memory_share_postgres.py
          tests/test_experience_v3_journey.py
          tests/test_experience_source_deletion.py
          tests/test_experience_source_api.py
          tests/test_experience_retention.py
          tests/test_experience_readback.py
          tests/test_schedule_propagation.py
          --junitxml=product-postgres.xml
      - name: Confirm database checks actually ran
        working-directory: backend
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse("product-postgres.xml").getroot()
          cases = root.findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("PostgreSQL checks must execute without skips")
          PY
      - name: Preserve PostgreSQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-postgres-results
          path: backend/product-postgres.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check shared v3 client types
        working-directory: frontend
        run: npx tsc --noEmit -p ../packages/trip-check-client/tsconfig.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: isolated-ci-browser-only-key
      TRIP_UNDERSTANDING_COOKIE_SIGNING_KEY: isolated-ci-cookie-only-key
      TRIP_UNDERSTANDING_SOURCE_ENCRYPTION_KEY: isolated-ci-source-only-key
      EXPERIENCE_WORKERS_ENABLED: "true"
      EXPERIENCE_WEB_RUNTIME: "1"
      BACKEND_INTERNAL_URL: http://127.0.0.1:8006
      E2E_BASE_URL: http://127.0.0.1:3106
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Initialize isolated database
        working-directory: backend
        run: python -m scripts.init_experience_database
      - name: Start text API and necessary workers
        working-directory: backend
        run: python -m uvicorn app.experience_main:app --host 127.0.0.1 --port 8006 --no-access-log > /tmp/experience-api.log 2>&1 &
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start built frontend
        working-directory: frontend
        run: npm run start -- --hostname 127.0.0.1 --port 3106 > /tmp/experience-web.log 2>&1 &
      - name: Wait for application readiness
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for url in ('http://127.0.0.1:8006/health', 'http://127.0.0.1:3106'):
              for attempt in range(60):
                  try:
                      with urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              break
                  except OSError:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit('Application did not become ready')
          PY
      - name: Verify local browser journeys without external credentials
        working-directory: frontend
        run: npx playwright test e2e/experience.spec.js -c playwright.experience.config.js --grep-invert @live
      - name: Preserve core browser result before the next suite
        if: always()
        run: cp frontend/test-results/experience-report.json frontend/experience-core-report.json
      - name: Preserve core browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-core-browser-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Respect the shared per-minute write limit between browser suites
        run: sleep 60
      - name: Verify progressive disclosure, recovery and narrow layouts
        working-directory: frontend
        run: npx playwright test e2e/experience-refinement.spec.js -c playwright.experience.config.js
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-browser-results
          path: |
            frontend/test-results
            frontend/experience-core-report.json
          if-no-files-found: ignore

  core-mainline:
    name: core-mainline
    needs: [contract, backend, postgres, frontend, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all current code checks
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BROWSER_RESULT" = success
          echo "Contract, backend, PostgreSQL, frontend build and local browser journeys passed." >> "$GITHUB_STEP_SUMMARY"
          echo "External live model/AMap checks and human usability are reported separately, not inferred from CI." >> "$GITHUB_STEP_SUMMARY"
