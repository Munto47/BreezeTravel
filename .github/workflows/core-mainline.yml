        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify G05 source, projection, API and governance contracts
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_g05_source_admission.py
          tests/test_g05_knowledge_admin.py
          tests/test_g05_knowledge_targeted.py
          tests/test_g05_knowledge_api.py
          tests/test_g05_knowledge_ablation.py
          tests/test_g05_governance_delivery.py
          tests/test_trip_understanding_v3.py
          tests/test_trip_understanding_v3_api.py
      - name: Run frozen G05 knowledge admission and ablation gate
        working-directory: backend
        run: python -m scripts.run_g05_knowledge_gate
      - name: Check G05 implementation style
        working-directory: backend
        run: >-
          python -m ruff check
          app/api/trip_understandings_v3.py
          app/trip_understanding/knowledge.py
          app/trip_understanding/knowledge_admin.py
          app/trip_understanding/knowledge_repository.py
          app/trip_understanding/models.py
          app/trip_understanding/repository.py
          evals/g05_knowledge
          scripts/manage_g05_knowledge.py
          scripts/run_g05_knowledge_gate.py
          tests/test_g05_knowledge_ablation.py
          tests/test_g05_knowledge_admin.py
          tests/test_g05_knowledge_api.py
          tests/test_g05_knowledge_postgres.py
          tests/test_g05_knowledge_targeted.py
          tests/test_g05_governance_delivery.py
          tests/test_g05_source_admission.py

  g05_postgresql:
    name: g05_postgresql
    needs: core-mainline-preflight
    if: ${{ needs.core-mainline-preflight.outputs.sequence == '5' && needs.core-mainline-preflight.outputs.work_kind != 'GOAL_TRANSITION' }}
    runs-on: ubuntu-latest
