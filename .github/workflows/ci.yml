name: Three-city RC1 candidate offline gates

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      AMAP_API_KEY: ""
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app evals scripts tests
      - run: python -m pytest -m "not external and not integration and not local_e2e" --randomly-seed=17 --tb=short
      - run: python -m pytest -m "not external and not integration and not local_e2e" --randomly-seed=42 --tb=short
      - run: python -m pytest -m "not external and not integration and not local_e2e" --randomly-seed=91 --tb=short
      - run: python -m scripts.run_local_eval_suite
      - run: python -m scripts.run_fault_injection
      - run: python -m scripts.verify_rc1_evidence verify --summary evidence/three_city_rc1/summary.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  yjs-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: y-websocket/package-lock.json
      - run: npm ci
        working-directory: y-websocket
      - run: npm test
        working-directory: y-websocket
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.multi.yml config --quiet
      - run: git diff --check
