name: Deploy to Aliyun

# 触发条件：push 到 main 分支 + 允许手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 只跑一次，新提交会取消上一次未完成的部署
concurrency:
  group: deploy-aliyun
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH 部署到阿里云
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 通过 SSH 拉取 + 重启服务
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          # script 在服务器上执行
          script: |
            set -e
            cd /root/breezetravel
            echo ">>> [1/4] 拉取最新代码"
            git fetch --all --prune
            git reset --hard origin/main
            echo ">>> [2/4] 构建并重启容器（增量 build，依赖未变时使用层缓存）"
            docker compose up -d --build --remove-orphans
            echo ">>> [3/4] 等待 backend 健康检查"
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "    backend OK"
                break
              fi
              sleep 2
            done
            echo ">>> [4/4] 清理悬空镜像"
            docker image prune -f
            echo "✅ 部署完成"
