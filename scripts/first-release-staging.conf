# Private pre-cutover HTTPS validation. This port is loopback-only.
server {
    listen 127.0.0.1:8443 ssl;
    server_name www.breezetravel.cn breezetravel.cn;
    ssl_certificate /etc/letsencrypt/live/breezetravel.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breezetravel.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 1m;
    access_log off;
    error_log /dev/null;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://127.0.0.1:8018/health; }
    location /yjs/ {
        proxy_pass http://127.0.0.1:1246/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    location / {
        proxy_pass http://127.0.0.1:3118;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
